services:
  bitcoind:
    image: registry.gitlab.com/hashbeam/docker/bitcoind:30.2
    command: "-fallbackfee=0.0002"
    environment:
      MYUID: 1000
      MYGID: 1000
      RPCAUTH: "user:84c66d54d736d8b02aaa5b02e07e759b$$cc56c229b2a49ae2bfd5932cc8a6135d435bb9a7ac037ddd351d65936082c03d"
    ports:
      - 18443:18443
    volumes:
      - ./datacore:/srv/app/.bitcoin
  electrs:
    image: registry.gitlab.com/hashbeam/docker/electrs:0.11.0
    environment:
      MYUID: 1000
      MYGID: 1000
      BTCPASS: "password"
    volumes:
      - ./dataindex:/srv/app/db
    depends_on:
      - bitcoind
    ports:
      - 50001:50001
  # its electrum RPC is only bound inside the container, so it doesn't clash with electrs
  esplora:
    image: blockstream/esplora:latest
    entrypoint: []
    command: >
      /srv/explorer/electrs_bitcoin/bin/electrs
      --timestamp
      --network regtest
      --jsonrpc-import
      --cookie user:password
      --daemon-rpc-addr bitcoind:18443
      --http-addr 0.0.0.0:3002
      --electrum-rpc-addr 0.0.0.0:60401
      --db-dir /data/db
      --cors '*'
    volumes:
      - ./dataesplora:/data
    depends_on:
      - bitcoind
    ports:
      - 3002:3002
  proxy:
    image: ghcr.io/rgb-tools/rgb-proxy-server:0.3.0
    ports:
      - 3000:3000
