name: UniFFI Artifacts

on:
  push:
    branches: ["master", "dev", "stage"]
  pull_request:
    branches: ["master", "dev", "stage"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  library-core-tests:
    name: Library Core Tests
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Run library-only test suite
        run: cargo test --features "uniffi,vls,vss,test-utils" --test lib_core

  kotlin-jvm:
    name: Kotlin JVM (Linux host)
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Build host cdylib
        run: cargo build --release --features "uniffi,vls,vss" --lib

      - name: Generate Kotlin bindings
        run: ./scripts/ci/uniffi_generate_kotlin.sh

      - name: Package Kotlin JVM bundle
        run: |
          mkdir -p artifacts/kotlin-jvm
          cp -r target/uniffi/kotlin artifacts/kotlin-jvm/
          cp target/release/librgb_lightning_node.so artifacts/kotlin-jvm/

      - name: Upload Kotlin JVM artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-jvm-host
          path: artifacts/kotlin-jvm/**

  kotlin-android:
    name: Kotlin Android (JNI)
    runs-on: warp-ubuntu-latest-x64-16x
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Normalize Android NDK env
        run: |
          NDK_PATH="/usr/local/lib/android/sdk/ndk/27.3.13750724"
          test -d "$NDK_PATH"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_ANDROID_NDK_ROOT=$NDK_PATH" >> "$GITHUB_ENV"
          echo "AWS_LC_SYS_ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Add Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add armv7-linux-androideabi
          rustup target add x86_64-linux-android

      - name: Install Android native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build make clang pkg-config build-essential

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked

      - name: Install bindgen-cli
        run: |
          cargo install --force --locked bindgen-cli
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          bindgen --version

      - name: Build host cdylib with external signer API
        run: cargo build --release --features "uniffi,vls,vss" --lib

      - name: Generate Kotlin Android bindings
        run: ./scripts/ci/uniffi_generate_from_library.sh kotlin target/uniffi/kotlin-android target/release/librgb_lightning_node.so uniffi-android.toml

      - name: Build Android JNI libs
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.3.13750724
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/27.3.13750724
          AWS_LC_SYS_EXTERNAL_BINDGEN: "1"
          CMAKE: /usr/bin/cmake
          UNIFFI_CARGO_FEATURES: "uniffi,vls,vss"
        run: |
          echo "Using NDK_HOME=${ANDROID_NDK_HOME}"
          echo "Using NDK_ROOT=${ANDROID_NDK_ROOT}"
          echo "Using NDK=${ANDROID_NDK}"
          echo "Using CMAKE=${CMAKE}"
          "${CMAKE}" --version
          test -d "${ANDROID_NDK_HOME}"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi="--sysroot=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export AWS_LC_SYS_ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          export AWS_LC_SYS_ANDROID_NDK="${ANDROID_NDK_HOME}"
          ./scripts/ci/build_android_jni.sh

      - name: Upload Kotlin Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-android-jni
          path: target/uniffi/kotlin-android/**

  swift:
    name: Swift iOS XCFramework
    runs-on: warp-macos-latest-arm64-6x
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Install bindgen-cli
        run: |
          cargo install --force --locked bindgen-cli
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          bindgen --version

      - name: Add Apple targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Build static libraries for Apple targets
        env:
          AWS_LC_SYS_EXTERNAL_BINDGEN: "1"
        run: |
          IOS_SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          SIM_SYSROOT="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          IOS_SDK_VER="$(xcrun --sdk iphoneos --show-sdk-version)"
          SIM_SDK_VER="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          export IPHONEOS_DEPLOYMENT_TARGET="${IOS_SDK_VER}"
          export CARGO_TARGET_AARCH64_APPLE_IOS_RUSTFLAGS="-C link-arg=-miphoneos-version-min=${IOS_SDK_VER}"
          export CARGO_TARGET_AARCH64_APPLE_IOS_SIM_RUSTFLAGS="-C link-arg=-mios-simulator-version-min=${SIM_SDK_VER}"
          export CARGO_TARGET_X86_64_APPLE_IOS_RUSTFLAGS="-C link-arg=-mios-simulator-version-min=${SIM_SDK_VER}"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="--sysroot=${IOS_SYSROOT}"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim="--sysroot=${SIM_SYSROOT}"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_apple_ios="--sysroot=${SIM_SYSROOT}"
          cargo build --release --features "uniffi,vls,vss" --lib
          cargo build --release --features "uniffi,vls,vss" --lib --target aarch64-apple-ios
          cargo build --release --features "uniffi,vls,vss" --lib --target aarch64-apple-ios-sim
          cargo build --release --features "uniffi,vls,vss" --lib --target x86_64-apple-ios

      - name: Generate Swift bindings
        run: ./scripts/ci/uniffi_generate_from_library.sh swift target/uniffi/swift target/release/librgb_lightning_node.dylib

      - name: Package XCFramework
        run: ./scripts/ci/package_swift_xcframework.sh

      - name: Upload Swift artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-xcframework
          path: |
            target/uniffi/swift/RGBLightningNode.xcframework/**
            target/uniffi/swift/RGBLightningNode.swift
            target/uniffi/swift/RGBLightningNodeFFI.h
            target/uniffi/swift/RGBLightningNodeFFI.modulemap
