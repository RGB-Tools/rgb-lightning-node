name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [ stable, 1.88.0, beta ]
        name: [ linux, windows, macos ]
        exclude:
          - name: windows
            toolchain: beta
          - name: macos
            toolchain: beta
        include:
          - name: linux
            os: ubuntu-latest
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
    steps:
      - uses: ilammy/setup-nasm@v1
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{matrix.toolchain}}
          rustflags: ""
      - name: Build
        run: cargo build --release
      - name: Build (electrum only)
        if: matrix.name == 'linux' && matrix.toolchain == 'stable'
        run: cargo build --release --no-default-features --features electrum,block-sync,transaction-sync
      - name: Build (esplora only)
        if: matrix.name == 'linux' && matrix.toolchain == 'stable'
        run: cargo build --release --no-default-features --features esplora,block-sync,transaction-sync
      - name: Build (block-sync only)
        if: matrix.name == 'linux' && matrix.toolchain == 'stable'
        run: cargo build --release --no-default-features --features block-sync,electrum,esplora
      - name: Build (transaction-sync only)
        if: matrix.name == 'linux' && matrix.toolchain == 'stable'
        run: cargo build --release --no-default-features --features transaction-sync,electrum,esplora
