server {
    listen 80 default_server;
    root /srv/cache/symlinks;

    # Snapshot requests come in as /{timestamp}; the RGS server writes
    # /srv/cache/symlinks/{timestamp}.bin. try_files appends the .bin suffix.
    location / {
        try_files $uri $uri.bin =404;
        default_type application/octet-stream;
    }
}
